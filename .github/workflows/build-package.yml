name: Build and Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Verify repository architecture
      run: |
        python scripts/verify_repository.py --structure-only

    - name: Run tests with branch coverage
      run: |
        python scripts/run_coverage.py

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: core-coverage
        path: coverage.xml
        retention-days: 14
        
    - name: Create addon package
      run: |
        python scripts/package_addon.py
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BASICs_shape_key_manager
        path: BASICs_shape_key_manager.zip
        retention-days: 14

  blender:
    uses: ./.github/workflows/blender-integration.yml
